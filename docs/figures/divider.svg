<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#333"/></marker><marker id="as" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L11,4.5 L0,9 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><polygon points="330,13.0 405.0,48 330,83.0 255.0,48" fill="#ffe9a6" stroke="#333" stroke-width="1.5"/><text x="330" y="52.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">B = 0 ?</text><path d="M330 83 L330 125" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="352" y="108" font-size="11" text-anchor="start" fill="#555">no</text><path d="M405 48 L470 48" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="428" y="40" font-size="11" text-anchor="middle" fill="#555">yes</text><rect x="470" y="22" width="220" height="52" rx="6" fill="#ffd3d3" stroke="#333" stroke-width="1.5"/><text x="580.0" y="44.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">divByZero = 1</text><text x="580.0" y="59.85" font-size="11" text-anchor="middle" fill="#555">no result, pipeline halts</text><rect x="180" y="125" width="300" height="50" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="330.0" y="146.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">N = |A|,  D = |B|</text><text x="330.0" y="161.85" font-size="11" text-anchor="middle" fill="#555">Q = N (32-bit),  R = 0 (33-bit signed)</text><path d="M330 175 L330 235" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="120" y="205" width="420" height="355" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4"/><text x="134" y="224" font-size="12" text-anchor="start" fill="#555" font-weight="bold">repeat 32 times</text><rect x="200" y="235" width="260" height="40" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="330.0" y="259.2" font-size="12" text-anchor="middle" fill="#1a1a1a">s = sign of R   (before the shift)</text><path d="M330 275 L330 295" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="295" width="260" height="40" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="330.0" y="312.7" font-size="12" text-anchor="middle" fill="#1a1a1a">shift R:Q left by 1</text><text x="330.0" y="325.0" font-size="10" text-anchor="middle" fill="#555">(top bit of Q enters R)</text><path d="M330 335 L330 350" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><polygon points="330,350.0 415.0,385 330,420.0 245.0,385" fill="#ffe9a6" stroke="#333" stroke-width="1.5"/><text x="330" y="382.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">s = 1 ?</text><text x="330" y="395.5" font-size="10" text-anchor="middle" fill="#555">(R was negative)</text><path d="M245 385 L210 385 L210 440" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="222" y="377" font-size="11" text-anchor="middle" fill="#555">yes</text><path d="M415 385 L450 385 L450 440" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="438" y="377" font-size="11" text-anchor="middle" fill="#555">no</text><rect x="150" y="440" width="120" height="38" rx="6" fill="#cfe3ff" stroke="#333" stroke-width="1.5"/><text x="210.0" y="463.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">R = R + D</text><rect x="390" y="440" width="120" height="38" rx="6" fill="#cfe3ff" stroke="#333" stroke-width="1.5"/><text x="450.0" y="463.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">R = R − D</text><path d="M210 478 L210 498" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><path d="M450 478 L450 498" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="498" width="260" height="40" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="330.0" y="515.7" font-size="12" text-anchor="middle" fill="#1a1a1a">lowest bit of Q = 1 if R ≥ 0</text><text x="330.0" y="528.0" font-size="10" text-anchor="middle" fill="#555">otherwise 0</text><path d="M460 518 L585 518 L585 255 L462 255" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/><text x="592" y="390" font-size="11" text-anchor="start" fill="#555">next</text><text x="592" y="405" font-size="11" text-anchor="start" fill="#555">step</text><path d="M330 538 L330 590" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><polygon points="330,590.0 405.0,625 330,660.0 255.0,625" fill="#ffe9a6" stroke="#333" stroke-width="1.5"/><text x="330" y="629.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">R &lt; 0 ?</text><path d="M405 625 L450 625" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="428" y="617" font-size="11" text-anchor="middle" fill="#555">yes</text><rect x="450" y="606" width="150" height="38" rx="6" fill="#cfe3ff" stroke="#333" stroke-width="1.5"/><text x="525.0" y="622.7" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">R = R + D</text><text x="525.0" y="635.0" font-size="10" text-anchor="middle" fill="#555">final correction</text><path d="M330 660 L330 700" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="352" y="684" font-size="11" text-anchor="start" fill="#555">no</text><path d="M525 644 L525 700" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="110" y="700" width="440" height="60" rx="6" fill="#d4efc8" stroke="#333" stroke-width="1.5"/><text x="330.0" y="718.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">quotient = Q  (negated if the signs of A and B differ)</text><text x="330.0" y="734.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">remainder = R  (negated if A &lt; 0)</text><text x="330.0" y="749.5" font-size="10" text-anchor="middle" fill="#555">every + and − above uses the 33-bit Han-Carlson adder</text></svg>