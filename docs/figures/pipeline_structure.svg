" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="875" y="90" width="14" height="64" rx="2" fill="#dddddd" stroke="#555" stroke-width="1.2"/><path d="M889 122 L910 122" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="882" y="84" font-size="10" text-anchor="middle" fill="#555" font-weight="bold">MEM/RW</text><path d="M618 90 L618 40 L90 40 L90 88" fill="none" stroke="#c05621" stroke-width="1.8" marker-end="url(#a)"/><text x="350" y="30" font-size="11" text-anchor="middle" fill="#c05621">EX redirects machine.pc when a branch is taken (otherwise IF simply does pc++)</text><rect x="15" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="90.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">instrMemory[pc]</text><text x="90.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">labels are skipped</text><path d="M90 215 L90 157" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="191" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="266.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">controlunit</text><text x="266.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">generatecontrolsignals</text><path d="M266 157 L266 213" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#as)"/><rect x="367" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="442.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Reg[ ]  (read)</text><text x="442.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">R0 always reads 0</text><path d="M442 215 L442 157" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="543" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="618.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ALU + flags</text><text x="618.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">zero · neg · over · carry</text><path d="M618 157 L618 213" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#as)"/><rect x="719" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="794.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">memory[ ]</text><text x="794.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">word addressed</text><path d="M794 157 L794 213" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#as)"/><rect x="895" y="215" width="150" height="56" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/><text x="970.0" y="239.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Reg[ ]  (write)</text><text x="970.0" y="254.5" font-size="10" text-anchor="middle" fill="#555">writes to R0 ignored</text><path d="M970 157 L970 213" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="30" y="306" font-size="11" text-anchor="start" fill="#555" font-weight="bold">fields each stage fills in the Latch:</text><text x="90" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">pc, raw</text><text x="266" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">sig, rd, rs1, rs2,</text><text x="266" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a">imm, offset</text><text x="442" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">opA, opB,</text><text x="442" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a">storeVal</text><text x="618" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">aluResult, branchTaken,</text><text x="618" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a">branchTarget</text><text x="794" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">memData,</text><text x="794" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a">writeData</text><text x="970" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">(consumes the latch)</text></svg>