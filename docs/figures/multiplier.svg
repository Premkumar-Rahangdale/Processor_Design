<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" width="1100" height="310" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#333"/></marker><marker id="as" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L11,4.5 L0,9 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="15" y="125" width="100" height="50" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="65.0" y="146.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">B</text><text x="65.0" y="161.85" font-size="11" text-anchor="middle" fill="#555">multiplier</text><path d="M115 150 L165 150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="165" y="100" width="150" height="100" rx="6" fill="#d4efc8" stroke="#333" stroke-width="1.5"/><text x="240.0" y="129.05" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Booth encoder</text><text x="240.0" y="145.35" font-size="11" text-anchor="middle" fill="#555">radix-4</text><text x="240.0" y="162.35" font-size="11" text-anchor="middle" fill="#555">16 digits in</text><text x="240.0" y="179.35" font-size="11" text-anchor="middle" fill="#555">{−2, −1, 0, +1, +2}</text><path d="M315 150 L365 150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="340" y="140" font-size="10" text-anchor="middle" fill="#555">digits</text><rect x="440" y="14" width="100" height="44" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="490.0" y="32.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">A</text><text x="490.0" y="47.85" font-size="11" text-anchor="middle" fill="#555">multiplicand</text><path d="M490 58 L490 100" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="365" y="100" width="190" height="100" rx="6" fill="#d4efc8" stroke="#333" stroke-width="1.5"/><text x="460.0" y="129.05" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Partial-product rows</text><text x="460.0" y="145.35" font-size="11" text-anchor="middle" fill="#555">row i = digit i × A, &lt;&lt; 2i</text><text x="460.0" y="162.35" font-size="11" text-anchor="middle" fill="#555">negative rows inverted</text><text x="460.0" y="179.35" font-size="11" text-anchor="middle" fill="#555">+1 bits gathered in 1 row</text><path d="M555 150 L605 150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="580" y="140" font-size="11" text-anchor="middle" fill="#555">17 rows</text><rect x="605" y="100" width="180" height="100" rx="6" fill="#d4efc8" stroke="#333" stroke-width="1.5"/><text x="695.0" y="129.05" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Wallace tree</text><text x="695.0" y="145.35" font-size="11" text-anchor="middle" fill="#555">3:2 compressors</text><text x="695.0" y="162.35" font-size="11" text-anchor="middle" fill="#555">17→12→8→6→4→3→2</text><text x="695.0" y="179.35" font-size="11" text-anchor="middle" fill="#555">6 levels</text><path d="M785 150 L835 150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="810" y="140" font-size="11" text-anchor="middle" fill="#555">2 rows</text><rect x="835" y="100" width="150" height="100" rx="6" fill="#cfe3ff" stroke="#333" stroke-width="1.5"/><text x="910.0" y="137.55" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Final adder</text><text x="910.0" y="153.85" font-size="11" text-anchor="middle" fill="#555">Han-Carlson,</text><text x="910.0" y="170.85" font-size="11" text-anchor="middle" fill="#555">32-bit</text><path d="M985 150 L1035 150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="1068" y="140.2" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">result</text><text x="1068" y="153.85" font-size="11" text-anchor="middle" fill="#555">low 32</text><text x="1068" y="167.85" font-size="11" text-anchor="middle" fill="#555">bits</text><text x="550" y="250" font-size="12" text-anchor="middle" fill="#555">Only the low 32 bits of the 64-bit product are built: every row and every carry is cut to 32 bits.</text><text x="550" y="272" font-size="12" text-anchor="middle" fill="#555">The result is the same for signed and unsigned operands (two's complement wraps modulo 2^32).</text></svg>